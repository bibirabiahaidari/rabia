<!DOCTYPE html>
<html>
    <head>
        <title>
            Registration Form
        </title>
    </head>
    <style>
        img{
            height: 30px;
            width: 30px;
            margin-top: 20px;
    
            
        }
        .h2{
            display: flex;
        }
    </style>
    <body>
        <h1>Registration Form</h1>
        <p>please fill in the detail below to create your account</p>
        <form>
            <div class="h2">
            <img src="noun_User_205575.svg" alt="personal icon">
           

            <h2>

                 1. Personal Information
            </h2>
            </div>

            <hr>
            <label for="username"> Full Name:</label>
            <input type="text" name="username" id="username" max="30" placeholder="Enter your full name" required>
            <br><br>

            <label for="email address">Email Address:</label>
            <input type="email" name="email" id="email" max="30" placeholder="Enter your email address" required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" name="password" id="password" max="10" placeholder="*********" required>
            <br><br>

            <label for="dob">DATE Of Birth:</label>
            <input type="date" name="dob" id="dob" required>
            <br><br>

            <label for="age">Age:</label>
            <input type="number" name="age" id="age" max="10" min="100" required>
            <br><br>


            <label for="Nationality">Nationality</label>
            <select name="Nationality" id="nationality" required>
                <option value="">Select Your Nationality</option>
                <option value="pk">Pakistan</option>
                <option value="afg">Afghanistan</option>
                <option value="ind">India</option>
                <option value="aus">Australia</option>
            </select>
            <hr>


            <strong>Gender</strong>
            <input type="radio" name="gender" id="female" value="female">
            <label for="female">Female</label>
            <input type="radio" name="gender" id="male" value="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="other" value="other">
            <label for="other">Other</label>
            <hr>
            
            <p>Hobbies (Select all that apply)</p>
            <input type="chechbox" name="hobbies" id="reading" value="reading">
            <label for="reading">Reading</label>
            <input type="checkbox" name="hobbies" id="coding" value="coding">
  
        </form>
        
    </body>
</html>
