<html>
    <head>
        <title>
            Contact us
        </title>

    </head>
    <body>
        <h1>Get in Touch</h1>
        <p>We,d love to hear from you.send us a message</p>
        <form action="submit" method="post">
            <label for="username">First Name</label>
            <input type="username" name="username" id="username" max="40"  placeholder="enter your first name" required>
            <br><br>
            <label for="lastname">Last Name</label>
            <input type="username" name="username" id="username" max="40" placeholder="enter your last name" required>
            <br><br>
            <label for="email">Email ID</label>
            <input type="email" name="email" id="email" placeholder="enter your email id" required>
            <br><br>
            <label for="phone">Mobile Number</label>
            <input type="tell" name="mobilenum" id="mobilenum" max="11" placeholder="+923*********" required>
            <br><br>
            <label for="gender">Gender</label>
            <input type="radio" name="gender" id="male" value="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female" value="female">
            <label>Female</label>
            <br><br>
            <label for="dob">Date Of Birth</label>
            <input type="date" name="dob" id="dob" required>
            <br><br>
            <label>Address</label>
            <input type="address" name="address" id="address" cols="40" rows="4" placeholder="enter your address" required>
            <br><br>
            <label for="city">City</label>
            <input type="city" name="city" id="city" max="20" placeholder="enter your city name" required>
            <br><br>
            <label for="pincode">Pin Code</label>
            <input type="number" name="pincode" id="pincode" max="6" placeholder="******" required>
            <br><br>
            <label for="state">State</label>
            <input type="state" name="state" id="state" max="40" placeholder="enter your state name">
            <br><br>
            <label for="country">Country</label>
            <select>country
                <option value="">select your country</option>
                <option value="au">Australia</option>
                <option value="at">Austria</option>
                <option value="ca">Canada</option>
                <option value="fi">Finland</option>
                <option value="fr">France</option>
                <option value="de">Germany</option>
                <option value="in">India</option>
                <option value="it">Italy</option>
                <option value="jp">Japan</option>
            </select>
            




        </form>

    </body>


</html>
